<link rel="stylesheet" href="css/sb-admin-2.css">
<link href="css/sb-admin-2.min.css" rel="stylesheet">

<style>
    /** 
    account page 
    **/
    .main_img{
        position: relative;
        cursor: pointer;
        width: 300px;
        height: 300px;

    }
    .profile_img{
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
    }

    .main_overlay{
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        top: 0;
        left: 0;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 1s;
    }
    .main_overlay:hover{
        opacity: 1;
    }

    .main_overlay_blur {
        backdrop-filter: blur(5px);
    }

    .main_overlay > * {
        transform: translateY(20px);
        transition: transform 1s;
    }
    .main_overlay:hover > * {
        transform: translateY(0);
    }
</style>
<!-- Page Wrapper -->
<div id="wrapper">

    <!-- Sidebar -->
    {{> admin_sidebar}}
    <!-- End of Sidebar -->

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- Main Content -->
        <div id="content mt-5">

            <!-- Topbar -->
            {{> admin_navbar}}
            <!-- End of Topbar -->

            <!-- Begin Page Content -->
            <div class="container-fluid">

                <!-- Page Heading -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">Department</h1>
                </div>

                <!-- Content Row -->
                <div class="row">
                    {{> admin/departmentnav}}
                </div>

                <!-- Content Row -->
                <div class="row">
                    <div class="col-12 mb-4">
                        <!-- Approach -->
                        <div class="card shadow mb-4">
                            <div class="card-header py-3 d-flex justify-content-between">
                                <h6 class="m-0 font-weight-bold text-primary">Update Department</h6>
                                <div>
                                    <div id="delete" data-url="/admin/department/{{department.id}}" type="click" class="btn btn-danger"><i class="fas fa-solid fa-trash-can"></i></div>
                                    <div class="spinner-border d-none status" id="status" role="status">
                                        <span class="sr-only">Loading... </span>
                                    </div>
                                </div>
                            </div>
                            <div class="card-body">
                                <form action="/admin/department/{{department.id}}" method="POST" id="update-media" enctype="multipart/form-data" class="user needs-validation" novalidate>
                                    

                                    <div class="form-group">
                                        <input type="text" id="name" name="name" class="form-control form-control-user"
                                            id="exampleInputUsername" aria-describedby="usernameHelp"
                                            value="{{department.name}}" required>
                                        <div class="invalid-feedback">
                                            Enter a name
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <input type="text" name="department_head" class="rounded-1 form-control form-control-user" id="exampleInputhod"
                                          aria-describedby="" value="{{department.department_head}}" placeholder="Full Name and title of the department H.O.D..." required>
                                        <div class="invalid-feedback">
                                          Head of department's name is required
                                        </div>
                                      </div>

                                    <div class="form-group">
                                        <textarea name="department_briefing" class="form-control rounded-1" id="exampleInputlocation" rows="3"
                                          aria-describedby="locationHelp" placeholder="Briefing about the department..." required>{{department.department_briefing}}
                                        </textarea>
                                        <div class="invalid-feedback">
                                          A briefing is required
                                        </div>
                                      </div>


                                    <div class="form-group row block">
                                        <div class="container col-7 mt-3 mb-4 d-block justify-content-start">
                                            <label for="" class="fw-bold fs-6">Image</label>
                                            <div class="main_img container" id="id_image_group">
                                            <img style="width: 100%; object-fit:fill; border: 1px solid #ddd;" src="{{department.image_url}}" alt="media Image" class="profile_img" id="id_image_display">
                                            <div class="main_overlay main_overlay_blur">
                                                <div class="text-center"><i class="fa fa-edit"></i> Change Image</div>
                                            </div>

                                            <input type="file" name="image" id="id_image_file" onchange="readURL(this)" accept="image/*" class="form-control" value="{{department.image_url}}" hidden="">
                                            </div>
                                            <div class="invalid-feedback">
                                                You need to select an image file
                                            </div>
                                        </div>
                                    </div>


                                    <hr>
                                    <ul id="error" class="text-danger col-12"></ul>

                                    <div class="spinner-border col-12 d-none status" id="status" role="status">
                                        <span class="sr-only">Loading... </span>
                                    </div>
                                    
                                    <progress id="progressBar" value="0" max="100" style="width: 100%; display: none;"></progress>
                                    <hr class="mb-3">

                                    <button type="submit" id="btn" class="btn btn-primary btn-user btn-block">
                                        Update
                                    </button>
                                    <hr>
                    
                                </form>
                               
                            </div>
                        </div>
                    </div>
                </div>

               
            </div>
            <!-- /.container-fluid -->

        </div>

    </div>
    <!-- End of Content Wrapper -->

</div>
<!-- End of Page Wrapper -->

<!-- Core plugin JavaScript-->
<script src="js/uploader.js"></script>
<!--<script src="js/user.js"></script>-->



<script src="vendor/jquery-easing/jquery.easing.min.js"></script>

<!-- Custom scripts for all pages-->
<script src="js/sb-admin-2.min.js"></script>
