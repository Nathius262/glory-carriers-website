<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Assign Member</h1>
        <a href="/admin/department/{{department.id}}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Back to Department
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form action="/admin/department/{{department.id}}/roles" id="create-form" class="needs-validation"
                method="POST" novalidate>

                <div class="row">

                    <!-- ROLE -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" name="name" class="form-control" id="name" placeholder="Enter name"
                                required>
                            <div class="invalid-feedback">
                                Please provide a valid name.
                            </div>
                        </div>
                    </div>

                    <!-- LEVEL -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="level" class="form-label">Level</label>
                            <input type="number" name="level" class="form-control" id="level"
                                placeholder="Enter level (e.g., 1 for HOD, 2 for regular member)" required>
                            <div class="invalid-feedback">
                                Please provide a valid level.
                            </div>
                        </div>

                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus me-2"></i>Create Role
                        </button>
                        <a href="/admin/department/{{department.id}}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>

            </form>
        </div>
    </div>
</div>

<script type="module" src="/assets/js/form-handler.js"></script>
