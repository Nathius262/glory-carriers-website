<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Assign Member</h1>
        <a href="/admin/department/{{department.id}}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Back to Department
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form action="/admin/department/members" id="assign-form" class="needs-validation" method="POST" novalidate>

                <!-- Hidden Department ID -->
                <input type="hidden" name="department_id" value="{{department.id}}" />

                <div class="row">

                    <!-- USER -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="user_id" class="form-label">Select User</label>
                            <select name="user_id" id="user_id" class="form-select" required>
                                <option value="">-- Select User --</option>
                                {{#each department.members}}
                                <option value="{{this.id}}">
                                    {{this.user.email}}
                                </option>
                                {{/each}}
                            </select>
                            <div class="invalid-feedback">
                                Please select a user.
                            </div>
                        </div>
                    </div>

                    <!-- ROLE -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="role_id" class="form-label">Select Role</label>
                            <select name="role_id" id="role_id" class="form-select" required>
                                <option value="">-- Select Role --</option>
                                {{#each department.roles}}
                                <option value="{{this.id}}">
                                    {{this.name}}
                                </option>
                                {{/each}}
                            </select>
                            <div class="invalid-feedback">
                                Please select a role.
                            </div>
                        </div>
                    </div>

                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus me-2"></i>Assign Member
                    </button>
                    <a href="/admin/department/{{department.id}}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>

<script type="module" src="/assets/js/form-handler.js"></script>
