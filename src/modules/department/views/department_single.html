
  <div class="container py-4">
    <div class="row">
      <div class="col-12">
        <nav aria-label="breadcrumb" class="mb-4">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/department">Department List</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{department.name}}</li>
          </ol>
        </nav>

        <div class="card shadow-sm">
          <div class="card-header bg-light">
            <h1 class="h3 mb-0">{{department.name}} || 'Department Details'}}</h1>
          </div>
          <div class="card-body">
            <dl class="row">
              <!-- Add your detail fields here -->
              <dt class="col-sm-3">ID</dt>
              <dd class="col-sm-9">{{department.id}}</dd>
              
              <dt class="col-sm-3">Name</dt>
              <dd class="col-sm-9">{{department.name}}</dd>
              
              <!-- Add more fields as needed -->
            </dl>
          </div>
          <div class="card-footer">
            <a href="/department" class="btn btn-secondary">
              <i class="fas fa-arrow-left me-2"></i>Back to List
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
