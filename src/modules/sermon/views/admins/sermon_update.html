<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="h3 mb-0">
            Update Sermon
        </h1>

        <a href="/admin/sermon" class="btn btn-secondary">

            <i class="fas fa-arrow-left me-2"></i>

            Back to List

        </a>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form
                action="/admin/sermon/{{sermon.id}}"
                method="POST"
                id="update-form"
                enctype="multipart/form-data"
                class="needs-validation"
                novalidate>

                <input
                    type="hidden"
                    name="_method"
                    value="PUT">

                <div class="row">

                    <!-- ====================================== -->
                    <!-- LEFT COLUMN -->
                    <!-- ====================================== -->

                    <div class="col-lg-8">

                        <div class="mb-3">

                            <label class="form-label">

                                Title

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="title"
                                name="title"
                                value="{{sermon.title}}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Slug

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="slug"
                                name="slug"
                                value="{{sermon.slug}}"
                                required>

                            <small class="text-muted">

                                SEO Friendly URL

                            </small>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Summary

                            </label>

                            <textarea
                                class="form-control"
                                rows="5"
                                name="summary"
                                placeholder="Short description">{{sermon.summary}}</textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Video URL

                            </label>

                            <input
                                type="url"
                                class="form-control"
                                name="video_url"
                                value="{{sermon.video_url}}"
                                placeholder="https://youtube.com/...">

                        </div>

                    </div>

                    <!-- ====================================== -->
                    <!-- RIGHT COLUMN -->
                    <!-- ====================================== -->

                    <div class="col-lg-4">

                        <div class="card">

                            <div class="card-header">

                                Sermon Media

                            </div>

                            <div class="card-body">

                                <!-- IMAGE -->

                                <div class="mb-3">

                                    <label class="form-label">

                                        Featured Image

                                    </label>

                                    <input
                                        type="file"
                                        class="form-control"
                                        id="id_image_file"
                                        name="image"
                                        accept=".jpg,.jpeg,.png,.webp">

                                </div>

                                <div class="text-center mb-4">

                                    <img
                                        id="id_image_display"
                                        src="{{sermon.image_url}}"
                                        class="img-fluid rounded border"
                                        style="max-height:220px;object-fit:cover;">

                                </div>

                                <!-- AUDIO -->

                                <div class="mb-3">

                                    <label class="form-label">

                                        Audio File

                                    </label>

                                    <input
                                        type="file"
                                        class="form-control"
                                        id="id_audio_file"
                                        name="audio"
                                        accept="audio/*">

                                </div>

                                <audio
                                    controls
                                    id="audioPlayer"
                                    style="width:100%;">

                                    <source
                                        src="{{sermon.audio_url}}"
                                        type="audio/*">

                                </audio>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="d-flex gap-2 mt-4">

                    <button
                        id="btn"
                        class="btn btn-primary">

                        <i class="fas fa-save me-2"></i>

                        Update Sermon

                    </button>

                    <a
                        href="/admin/sermon"
                        class="btn btn-outline-secondary">

                        Cancel

                    </a>

                </div>

                <progress
                    id="progressBar"
                    value="0"
                    max="100"
                    style="display:none;width:100%;"
                    class="mt-3">
                </progress>

            </form>

        </div>

    </div>

</div>

<script>
document.getElementById('title').addEventListener('keyup', function () {

    const slug = this.value
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');

    document.getElementById('slug').value = slug;

});

document.getElementById('id_image_file').addEventListener('change', function () {

    if (this.files.length) {

        readURL(this);

    }

});
</script>

<script type="module" src="/assets/js/uploader.js"></script>
