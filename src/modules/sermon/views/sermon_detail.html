<main class="py-5">

    <!-- HERO / SERMON DETAILS -->
    <section class="mb-5 mt-5">
        <div class="container">

            <div class="row g-4 align-items-center">

                <!-- IMAGE -->
                <div class="col-lg-6">
                    <div class="rounded-4 shadow-sm">
                        <img src="{{sermon.image_url}}" alt="{{sermon.title}}" class="w-100 rounded-2">
                    </div>
                </div>

                <!-- DETAILS -->
                <div class="col-lg-6">

                    <div class="mb-3">
                        <h1 class="fw-bold mb-2">{{sermon.title}}</h1>
                        <p class="text-muted mb-0">Sermon Message</p>
                    </div>

                    <hr>

                    <!-- ACTIONS -->
                    <div class="d-flex flex-wrap gap-3 align-items-center mt-3">

                        <div class="fw-bold text-uppercase">
                            Actions:
                        </div>

                        <!-- DOWNLOAD -->
                        <a href="{{sermon.audio_url}}" class="btn btn-dark btn-sm d-flex align-items-center gap-2"
                            onclick="downloadFile('{{sermon.audio_url}}'); return false;">
                            <img src="/assets/img/icon/download1.png" width="18" alt="">
                            Download
                        </a>

                        <!-- LISTEN -->
                        <a href="{{sermon.audio_url}}"
                            class="btn btn-outline-dark btn-sm d-flex align-items-center gap-2" target="_blank">
                            <img src="/assets/img/icon/listen1.png" width="18" alt="">
                            Listen
                        </a>

                    </div>

                    <!-- SPINNER -->
                    <div class="mt-3">
                        <div id="spinner" class="spinner-border text-dark" style="display:none;"></div>
                        <small class="text-muted d-block mt-2">
                            Download may take a few seconds depending on file size.
                        </small>
                    </div>

                </div>

            </div>
        </div>
    </section>


    <!-- 🔥 LIVE VIDEO SECTION (NEW) -->
    <div class="container">
        {{> live-video sermon=sermon}}
    </div>


    <!-- LATEST SERMONS -->
    <section class="py-5 bg-light">
        <div class="container">

            <div class="mb-4 text-center">
                <h2 class="fw-bold">Latest Sermons</h2>
                <p class="text-muted">Stay updated with recent messages</p>
            </div>

            <div class="row g-4">

                {{#each latestSermons}}
                <div class="col-lg-3 col-md-4 col-sm-6 p-3 mb-4 scroll-y-top-el">
                    <div class="" style="height: 300px;">
                        <img class="rounded-4" style="object-fit: fill; height: 100%; width: 100%;"
                            src="{{this.image_url}}" alt="{{this.title}}">
                    </div>
                    <div
                        class="d-flex justify-content-between mx-3 mx-auto mt-1 px-5 text-secondary container text-center ft-upper fs-6">
                        <a href="{{this.audio_url}}" class="download-link"><img src="/assets/img/icon/download1.png"
                                width="25" alt=""></a>
                        <a href="{{this.audio_url}}"><img src="/assets/img/icon/listen1.png" width="25" alt=""></a>
                        <a href="/sermon/{{this.slug}}" class="download-link nav-link text-secondary"><i
                                class="fa-solid fa-eye" style="font-size: 20px;"></i></a>
                    </div>
                </div>
                {{/each}}

            </div>

        </div>
    </section>

</main>
