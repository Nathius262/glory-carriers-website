<div class="container-fluid py-4">
    <!-- Page Header -->
    <div class="d-sm-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0 text-gray-800">Roles</h1>
            <p class="text-muted mb-0">Manage role accounts and permissions</p>
        </div>
        <a href="/admin/role/create" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Create New Role
        </a>
    </div>


    <!-- Roles Table Card -->
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h6 class="m-0 font-weight-bold text-primary">
                        <i class="fas fa-users me-2"></i>All Roles
                    </h6>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Name</th>
                                    <th scope="col" class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {{#each roles}}
                                <tr>
                                    <th scope="row" class="fw-normal">{{this.id}}</th>
                                    <td>
                                        <a href="/admin/role/{{this.id}}"
                                            class="text-primary text-decoration-none fw-bold">
                                            {{this.name}}
                                        </a>
                                    </td>

                                    <td>
                                        <div class="d-flex justify-content-end gap-2">
                                            <a href="/admin/role/{{this.id}}" class="btn btn-sm btn-outline-primary">
                                                <i class="fas fa-edit me-1"></i>Edit
                                            </a>
                                            <button data-delete="role-{{this.id}}" data-name="{{this.id}}"
                                                data-url="/admin/role/{{this.id}}" class="btn btn-danger btn-sm">
                                                <i class="fas fa-trash me-1"></i>Delete
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                {{/each}}
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    {{> pagination}}
                </div>
            </div>
        </div>
    </div>
</div>
