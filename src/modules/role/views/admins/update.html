<div class="container-fluid py-4">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0 text-gray-800">Roles</h1>
            <p class="text-muted mb-0">Update existing role accounts</p>
        </div>
        <a href="/admin/role" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Back to Roles
        </a>
    </div>


    <!-- Update Role Card -->
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h6 class="m-0 font-weight-bold text-primary">
                        <i class="fas fa-user-plus me-2"></i>Update Role
                    </h6>
                </div>
                <div class="card-body">
                    <form id="update-form" class="needs-validation" action="/admin/role/{{role.id}}" method="POST"
                        novalidate>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="exampleInputName" class="form-label">Role Name</label>
                                    <input type="text" name="name" value="{{role.name}}" class="form-control"
                                        id="exampleInputName" aria-describedby="nameHelp"
                                        placeholder="Enter role name..." required>
                                    <div class="invalid-feedback">
                                        Please provide a valid role name.
                                    </div>
                                </div>
                            </div>

                        </div>
                        <!-- Error Messages -->
                        <div class="row">
                            <div class="col-12">
                                <ul id="error" class="text-danger list-unstyled"></ul>
                            </div>
                        </div>

                        <!-- Loading Spinner -->
                        <div class="row">
                            <div class="col-12 text-center">
                                <div class="spinner-border text-primary d-none" id="status" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="d-flex gap-2 mt-4 w-100">
                            <button type="submit" id="btn" class="btn btn-primary w-100">
                                <i class="fas fa-user-plus me-2"></i>Update Role
                            </button>
                            <a href="/admin/role" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="/assets/js/form-handler.js"></script>
