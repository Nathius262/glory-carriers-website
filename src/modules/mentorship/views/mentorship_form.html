<main>
  <section class="about pt-5 pb-5 mt-0" id="mentorship-form">
    <div class="container" style="max-width: 800px; margin-top: 50px;">

      <div class="text-center mb-5">
        <h4 class="text-color-blue ft-upper text-center">Mentorship Program</h4>
        <h2 class="text-color-blue ft-upper text-center">Apply Now</h2>
        <p>
          Complete the form below to join our Mentorship Program.
          We are excited to walk with you on your growth journey.
        </p>
      </div>

      <form action="/mentorship" class="user needs-validation" method="POST" class="p-4 shadow-sm rounded-4 bg-light">

        <!-- Full Name -->
        <div class="mb-4">
          <label for="full_name" class="form-label fw-bold">Full Name *</label>
          <input type="text" class="form-control form-control-lg" id="full_name" name="full_name"
            placeholder="Enter your full name" required>
        </div>

        <!-- Email -->
        <div class="mb-4">
          <label for="email" class="form-label fw-bold">Email Address</label>
          <input type="email" class="form-control form-control-lg" id="email" name="email"
            placeholder="Enter your email">
        </div>

        <!-- Phone Number -->
        <div class="mb-4">
          <label for="phone_number" class="form-label fw-bold">Phone Number *</label>
          <input type="text" class="form-control form-control-lg" id="phone_number" name="phone_number"
            placeholder="Enter your phone number" required>
        </div>

        <!-- Address -->
        <div class="mb-4">
          <label for="address" class="form-label fw-bold">Address</label>
          <input type="text" class="form-control form-control-lg" id="address" name="address"
            placeholder="Enter your address">
        </div>

        <!-- Description -->
        <div class="mb-4">
          <label for="description" class="form-label fw-bold">Why do you want to join? *</label>
          <textarea class="form-control" id="description" name="description" rows="5"
            placeholder="Tell us briefly about yourself and your expectations..." required></textarea>
        </div>

        <hr>
        <ul id="error" class="text-danger col-12"></ul>

        <div class="spinner-border col-12 d-none" id="status" role="status">
          <span class="sr-only">Loading...</span>
        </div>

        <!-- Submit -->
        <div class="text-center mt-4">
          <button type="submit" id="btn" class="btn btn-lg fw-bold ft-upper px-5"
            style="background-color: var(--yellow);">
            Submit Application
          </button>
        </div>

      </form>

    </div>
  </section>
</main>

<script src="/assets/js/form-handler.js"></script>
