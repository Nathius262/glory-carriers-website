<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Update Mentorship</h1>
    <a href="/admin/mentorship" class="btn btn-secondary">
      <i class="fas fa-arrow-left me-2"></i>Back to List
    </a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form action="/admin/mentorship/{{mentorship.id}}" id="update-form" class="needs-validation" method="POST"
        novalidate>
        <input type="hidden" name="_method" value="PUT">

        <div class="row">

          <!-- Full Name -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" value="{{mentorship.full_name}}" readonly>
            </div>
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" value="{{mentorship.email}}" readonly>
            </div>
          </div>

          <!-- Phone -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input type="text" class="form-control" value="{{mentorship.phone_number}}" readonly>
            </div>
          </div>

          <!-- Born Again Date -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Born Again Date</label>
              <input type="date" class="form-control" value="{{mentorship.born_again_date}}" readonly>
            </div>
          </div>

          <!-- Born Again Place -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Born Again Place</label>
              <input type="text" class="form-control" value="{{mentorship.born_again_place}}" readonly>
            </div>
          </div>

          <!-- Program Type (Editable) -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="program_type" class="form-label">Program Type</label>
              <select name="program_type" id="program_type" class="form-select" required>
                <option value="FATHERHOOD" {{#if (eq mentorship.program_type "FATHERHOOD" )}}selected{{/if}}>Fatherhood
                </option>
                <option value="MENTORSHIP" {{#if (eq mentorship.program_type "MENTORSHIP" )}}selected{{/if}}>Mentorship
                </option>
                <option value="DISCIPLESHIP" {{#if (eq mentorship.program_type "DISCIPLESHIP" )}}selected{{/if}}>
                  Discipleship</option>
              </select>
              <div class="invalid-feedback">
                Please select a program type.
              </div>
            </div>
          </div>

          <!-- Address -->
          <div class="col-md-12">
            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" value="{{mentorship.address}}" readonly>
            </div>
          </div>

          <!-- Description -->
          <div class="col-md-12">
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="3" readonly>{{mentorship.description}}</textarea>
            </div>
          </div>

          <!-- Service History -->
          <div class="col-md-12">
            <div class="mb-3">
              <label class="form-label">Service History</label>
              <textarea class="form-control" rows="4" readonly>{{mentorship.service_history}}</textarea>
            </div>
          </div>

        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-2"></i>Update Mentorship
          </button>
          <a href="/admin/mentorship" class="btn btn-outline-secondary">Cancel</a>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="/assets/js/form-handler.js"></script>
