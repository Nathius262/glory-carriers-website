<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Create Event</h1>
    <a href="/admin/event" class="btn btn-secondary">
      <i class="fas fa-arrow-left me-2"></i>Back to List
    </a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form action="/admin/event/create" id="create-form" enctype="multipart/form-data" class="needs-validation"
        method="POST" novalidate>

        <div class="row">
          <!-- Title -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input type="text" name="title" class="form-control" id="title" placeholder="Enter event title" required>
              <div class="invalid-feedback">
                Please provide a valid title.
              </div>
            </div>
          </div>

          <!-- Image URL (handled by uploader.js) -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="image_url" class="form-label">Event Image</label>
              <input type="file" name="image_url" accept="image/*" class="form-control" id="image_file">
            </div>
          </div>

          <!-- Start Date -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="start_date" class="form-label">Start Date</label>
              <input type="datetime-local" name="start_date" class="form-control" id="start_date" required>
              <div class="invalid-feedback">
                Start date is required.
              </div>
            </div>
          </div>

          <!-- End Date -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="end_date" class="form-label">End Date</label>
              <input type="datetime-local" name="end_date" class="form-control" id="end_date">
            </div>
          </div>

          <!-- Recurring -->
          <div class="col-md-6">
            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" name="is_recurring" id="is_recurring">
              <label class="form-check-label" for="is_recurring">
                Recurring Event
              </label>
            </div>
          </div>

          <!-- Headline -->
          <div class="col-md-6">
            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" name="is_headline" id="is_headline">
              <label class="form-check-label" for="is_headline">
                Feature as Headline
              </label>
            </div>
          </div>
        </div>

        <!-- Description (CKEditor) -->
        <div class="mt-4">
          <label for="description" class="form-label">Description</label>
          <textarea name="description" id="description" class="form-control"></textarea>
        </div>

        <ul id="error" class="text-danger col-12"></ul>

        <progress class="w-100" id="progressBar" style="display: none;"></progress>

        <div class="spinner-border col-12 d-none" id="status" role="status">
          <span class="sr-only">Loading...</span>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Create Event
          </button>
          <a href="/admin/event" class="btn btn-outline-secondary">Cancel</a>
        </div>

      </form>
    </div>
  </div>
</div>

<!-- CKEditor -->
<script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
<script>
  ClassicEditor
    .create(document.querySelector('#description'))
    .catch(error => {
      console.error(error);
    });
</script>

<!-- File uploader -->
<script type="module" src="/assets/js/uploader.js"></script>
