<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Create Event</h1>
    <a href="/admin/event" class="btn btn-secondary">
      <i class="fas fa-arrow-left me-2"></i>Back to List
    </a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form action="/admin/event/{{event.id}}" id="update-form" enctype="multipart/form-data" class="needs-validation"
        method="POST" novalidate>

        <div class="row">
          <!-- Title -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input value="{{event.title}}" type="text" name="title" class="form-control" id="title"
                placeholder="Enter event title" required>
              <div class="invalid-feedback">
                Please provide a valid title.
              </div>
            </div>
          </div>

          <!-- image  -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="" class="fw-bold fs-6">Image</label>
              <div class="main_img container border" id="id_image_group">
                <img style="width: 100%; object-fit:fill; border: 1px solid #ddd;" src="{{event.image_url}}"
                  alt="choose an Image" class="profile_img" id="id_image_display">
                <div class="main_overlay main_overlay_blur">
                  <div class="text-center"><i class="fa fa-edit"></i> Click to Change the Image</div>
                </div>

                <input type="file" name="image_url" id="id_image_file" onchange="readURL(this)" accept="image/*"
                  class="form-control" value="{{event.image_url}}" hidden="">
              </div>
              <div class="invalid-feedback">
                You need to select an image file
              </div>
            </div>
          </div>

          <!-- Start Date -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="start_date" class="form-label">Start Date</label>
              <input value="{{formatDateForInput event.start_date}}" type="datetime-local" name="start_date"
                class="form-control" id="start_date" required>
              <div class="invalid-feedback">
                Start date is required.
              </div>
            </div>
          </div>

          <!-- End Date -->
          <div class="col-md-6">
            <div class="mb-3">
              <label for="end_date" class="form-label">End Date</label>
              <input value="{{formatDateForInput event.end_date}}" type="datetime-local" name="end_date"
                class="form-control" id="end_date">
            </div>
          </div>

          <!-- Recurring -->
          <div class="col-md-6">
            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" name="is_recurring" id="is_recurring" {{#if
                event.is_recurring}}checked{{/if}}>
              <label class="form-check-label" for="is_recurring">
                Recurring Event
              </label>
            </div>
          </div>

          <!-- Headline -->
          <div class="col-md-6">
            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" name="is_headline" id="is_headline" {{#if
                event.is_headline}}checked{{/if}}>
              <label class="form-check-label" for="is_headline">
                Feature as Headline
              </label>
            </div>
          </div>
        </div>

        <!-- Description (CKEditor) -->
        <div class="mt-4">
          <label for="description" class="form-label">Description</label>
          <textarea name="description" id="description" class="form-control">{{event.description}}</textarea>
        </div>

        <ul id="error" class="text-danger col-12"></ul>

        <progress class="w-100" id="progressBar" style="display: none;"></progress>

        <div class="spinner-border col-12 d-none" id="status" role="status">
          <span class="sr-only">Loading...</span>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Update Event
          </button>
          <a href="/admin/event" class="btn btn-outline-secondary">Cancel</a>
        </div>

      </form>
    </div>
  </div>
</div>

<!-- CKEditor -->
<script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
<script>
  ClassicEditor
    .create(document.querySelector('#description'))
    .catch(error => {
      console.error(error);
    });
</script>

<!-- File uploader -->
<script type="module" src="/assets/js/uploader.js"></script>
