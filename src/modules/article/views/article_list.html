<main class="py-5 my-5">

    <section class="container">

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                Articles
            </h1>

            <p class="text-muted">
                Read inspiring teachings, ministry updates and faith-building articles.
            </p>

        </div>

        <div class="row">

            {{#each articles}}

            <div class="col-lg-4 col-md-6 mb-5">

                <div class="card border-0 shadow-sm h-100">

                    <img
                        src="{{image_url}}"
                        class="card-img-top"
                        style="height:240px;object-fit:cover;"
                        alt="{{title}}">

                    <div class="card-body d-flex flex-column">

                        <small class="text-muted">

                            {{formatDate published_at "MMMM D, YYYY"}}

                        </small>

                        <h4 class="fw-bold mt-2">

                            {{title}}

                        </h4>

                        <p>

                            {{summary}}

                        </p>

                        <a
                            href="/article/{{slug}}"
                            class="btn btn-outline-primary mt-auto">

                            Read More

                        </a>

                    </div>

                </div>

            </div>

            {{/each}}

        </div>

        <div class="mt-5">

            {{> pagination}}

        </div>

    </section>

</main>
