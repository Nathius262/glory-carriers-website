<style>
  .article-content{
    font-size:1.08rem;
    line-height:1.9;
    color:#444;
  }

  .article-content p{
      margin-bottom:1.5rem;
  }

  .article-content img{
      width:100%;
      border-radius:12px;
      margin:2rem 0;
  }

  .article-content h2,
  .article-content h3,
  .article-content h4{
      margin-top:2rem;
      margin-bottom:1rem;
      font-weight:700;
  }

  .article-content blockquote{
      border-left:4px solid var(--blue);
      padding-left:1rem;
      margin:2rem 0;
      color:#666;
      font-style:italic;
  }

  .article-content ul,
  .article-content ol{
      padding-left:1.5rem;
      margin-bottom:1.5rem;
  }

  .article-content a{
      color:var(--blue);
      text-decoration:none;
  }

  .article-content a:hover{
      text-decoration:underline;
  }
</style>

<main>

    <!-- HERO -->

    <section class="py-5 bg-light mt-5 pt-5">

        <div class="container text-center">

            <img
                src="{{article.image_url}}"
                class="img-fluid rounded-4 shadow mb-5"
                style="max-height:550px;object-fit:cover;object-position:center;width:100%;"
                alt="{{article.title}}">

            <small class="text-primary text-uppercase">

                {{formatDate article.published_at "MMMM D, YYYY"}}

            </small>

            <h1 class="display-5 fw-bold mt-3">

                {{article.title}}

            </h1>

            <p class="lead text-muted mt-4">

                {{article.summary}}

            </p>

        </div>

    </section>


    <!-- ARTICLE BODY -->

    <section class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-9">

                    <div class="article-content">

                        {{{article.content}}}

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- SHARE

    <section class="pb-5">

        <div class="container text-center">

            <h5 class="mb-4">

                Share this Article

            </h5>

            <div class="d-flex justify-content-center gap-3 flex-wrap">

                <a
                    href="https://www.facebook.com/sharer/sharer.php?u={{currentUrl}}"
                    target="_blank"
                    class="btn btn-outline-primary">

                    Facebook

                </a>

                <a
                    href="https://twitter.com/intent/tweet?url={{currentUrl}}"
                    target="_blank"
                    class="btn btn-outline-dark">

                    X

                </a>

                <a
                    href="https://api.whatsapp.com/send?text={{currentUrl}}"
                    target="_blank"
                    class="btn btn-success">

                    WhatsApp

                </a>

            </div>

        </div>

    </section> -->


    <!-- RELATED -->

    {{#if latestArticles}}

    <section class="py-5 bg-light">

        <div class="container">

            <div class="text-center mb-5">

                <h2 class="fw-bold">

                    More Articles

                </h2>

            </div>

            <div class="row">

                {{#each latestArticles}}

                <div class="col-lg-4 mb-4">

                    <div class="card border-0 shadow-sm h-100">

                        <img
                            src="{{image_url}}"
                            class="card-img-top"
                            style="height:220px;object-fit:cover;">

                        <div class="card-body d-flex flex-column">

                            <small class="text-muted">

                                {{formatDate published_at "MMMM D, YYYY"}}

                            </small>

                            <h5 class="mt-2">

                                {{title}}

                            </h5>

                            <p>

                                {{summary}}

                            </p>

                            <a
                                href="/article/{{slug}}"
                                class="btn btn-outline-primary mt-auto">

                                Continue Reading

                            </a>

                        </div>

                    </div>

                </div>

                {{/each}}

            </div>

        </div>

    </section>

    {{/if}}

</main>
