<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Update Zoe Record</h1>
        <a href="/admin/media/zoe-record" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Back to List
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form action="/admin/media/zoe-record/{{zoe_record.id}}" id="update-form" enctype="multipart/form-data"
                class="needs-validation" method="PUT" novalidate>
                <div class="row">
                    <!-- title  -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" value="{{zoe_record.title}}" name="title" class="form-control" id="title"
                                placeholder="Enter title" required>
                            <div class="invalid-feedback">
                                Please provide a valid title.
                            </div>
                        </div>
                    </div>

                    <!-- video url  -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="video_url" class="form-label">Video URL</label>
                            <input type="url" value="{{zoe_record.video_url}}" name="video_url" class="form-control"
                                id="video_url" placeholder="Enter video URL">
                            <div class="invalid-feedback">
                                Please provide a valid video URL.
                            </div>
                        </div>
                    </div>

                    <!-- audio  -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <div class="">
                                <!-- Audio element with controls -->
                                <audio src="{{zoe_record.audio_url}}" controls style="width: 80%; object-fit: fill;"
                                    id="audioPlayer">
                                    <!-- If there's an initial URL, it will be loaded here -->
                                    <source src="{{zoe_record.audio_url}}" type="audio/*">
                                    Your browser does not support the audio element.
                                </audio>
                                <div class="mx-3">
                                    <label for="id_audio_file" class="text-center btn btn-outline-secondary"><i
                                            class="fa fa-edit"></i>
                                        Change Audio</label>
                                </div>
                                <!-- File input element -->
                                <input type="file" name="audio" value="{{zoe_record.audio_url}}" id="id_audio_file"
                                    accept="audio/*" class="form-control" hidden>
                            </div>
                            <div class="invalid-feedback">
                                You need to select an audio file
                            </div>
                        </div>
                    </div>

                    <!-- image  -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="" class="fw-bold fs-6">Image</label>
                            <div class="main_img container border" id="id_image_group">
                                <img style="width: 100%; object-fit:fill; border: 1px solid #ddd;"
                                    src="{{zoe_record.image_url}}" alt="choose an Image" class="profile_img"
                                    id="id_image_display">
                                <div class="main_overlay main_overlay_blur">
                                    <div class="text-center"><i class="fa fa-edit"></i> Click to Change the Image</div>
                                </div>

                                <input type="file" name="image" id="id_image_file" onchange="readURL(this)"
                                    accept="image/*" class="form-control" value="{{zoe_record.image_url}}" hidden=""
                                    required>
                            </div>
                            <div class="invalid-feedback">
                                You need to select an image file
                            </div>
                        </div>
                    </div>


                    <!-- Add more form fields in columns as needed -->
                </div>

                <ul id="error" class="text-danger col-12"></ul>

                <progress class="w-100" id="progressBar" style="display: none;"></progress>

                <div class="spinner-border col-12 d-none" id="status" role="status">
                    <span class="sr-only">updating...</span>
                </div>

                <div class="d-flex gap-2 mt-4 w-100">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sync-alt me-2"></i>Update Zoe Record
                    </button>
                    <a href="/admin/media/zoe-record" class="btn btn-outline-secondary w-100">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
