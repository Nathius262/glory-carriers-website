<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Create Nowword</h1>
        <a href="/admin/media/nowword" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Back to List
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form action="/admin/media/nowword/create" id="create-form" enctype="multipart/form-data"
                class="needs-validation" method="POST" novalidate>
                <div class="row">
                    <div class="form-group row">
                        <div class="container col-12 mt-3 mb-4 d-block justify-content-start">
                            <div class="container d-sm-block">
                                <!-- PDF Preview -->
                                <embed id="pdfPreview" src="" type="application/pdf" width="100%" height="400px"
                                    style="display: block; border: 1px solid #ddd;" />

                                <div class="mx-3 mt-3">
                                    <label for="id_pdf_file" class="text-center btn btn-outline-secondary"><i
                                            class="fa fa-edit"></i> Choose PDF</label>
                                </div>
                                <!-- File input element -->
                                <input type="file" name="file" id="id_pdf_file" accept="application/pdf"
                                    class="form-control" hidden required>
                            </div>
                            <div class="invalid-feedback">
                                You need to select a PDF file.
                            </div>
                        </div>
                    </div>

                </div>

                <ul id="error" class="text-danger col-12"></ul>

                <progress class="w-100" id="progressBar" style="display: none;"></progress>

                <div class="spinner-border col-12 d-none" id="status" role="status">
                    <span class="sr-only">Loading...</span>
                </div>

                <div class="d-flex gap-2 mt-4 w-100">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-plus me-2"></i>Create Nowword
                    </button>
                    <a href="/admin/media/nowword" class="btn btn-outline-secondary w-100">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
