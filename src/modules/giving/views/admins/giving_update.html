<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Update Giving</h1>
    <a href="/admin/giving" class="btn btn-secondary">
      <i class="fas fa-arrow-left me-2"></i>Back to List
    </a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form action="/admin/giving/{{giving.id}}" id="update-form" class="needs-validation" method="POST" novalidate>
        <input type="hidden" name="_method" value="PUT">

        <div class="row">

          <!-- ID -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">ID</label>
              <input type="text" class="form-control" value="{{giving.id}}" readonly>
            </div>
          </div>

          <!-- Reference -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Reference</label>
              <input type="text" class="form-control" value="{{giving.reference}}" readonly>
            </div>
          </div>

          <!-- Paystack Reference -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Paystack Reference</label>
              <input type="text" class="form-control" value="{{giving.paystack_reference}}" readonly>
            </div>
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" value="{{giving.email}}" readonly>
            </div>
          </div>

          <!-- First Name -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" value="{{giving.first_name}}" readonly>
            </div>
          </div>

          <!-- Last Name -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" value="{{giving.last_name}}" readonly>
            </div>
          </div>

          <!-- Phone -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="text" class="form-control" value="{{giving.phone}}" readonly>
            </div>
          </div>

          <!-- Amount -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Amount</label>
              <input type="text" class="form-control" value="{{giving.amount}}" readonly>
            </div>
          </div>

          <!-- Currency -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Currency</label>
              <input type="text" class="form-control" value="{{giving.currency}}" readonly>
            </div>
          </div>

          <!-- Payment Channel -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Payment Channel</label>
              <input type="text" class="form-control" value="{{giving.payment_channel}}" readonly>
            </div>
          </div>

          <!-- Payment Type -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Payment Type</label>
              <input type="text" class="form-control" value="{{giving.payment_type}}" readonly>
            </div>
          </div>

          <!-- Status -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">Status</label>
              <input type="text" class="form-control" value="{{giving.status}}" readonly>
            </div>
          </div>

        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-2"></i>Update Giving
          </button>
          <a href="/admin/giving" class="btn btn-outline-secondary">Cancel</a>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="/assets/js/form-handler.js"></script>
